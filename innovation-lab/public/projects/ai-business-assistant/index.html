<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Business Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  Layout concept: a planner's workbench. The brief sits in a sticky rail on the
  left, the plan sheet fills the right, and the break-even figure is the one
  loud element. Everything else stays quiet: hairlines, small caps labels, mono numbers.
*/
:root {
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --bg: #e9edf2;
  --surface: #fbfcfd;
  --surface-2: #f1f4f8;
  --ink: #0e1a2b;
  --ink-2: #4b5a6d;
  --ink-3: #738195;
  --line: #d2d9e2;
  --line-2: #e3e8ef;
  --accent: #0a6b5c;
  --accent-strong: #07564a;
  --on-accent: #ffffff;
  --accent-soft: #d6ede7;
  --watch: #8f5f00;
  --watch-soft: #f5e8cb;
  --risk: #b3362d;
  --risk-soft: #f7dcd8;
  --shadow: 0 1px 2px rgba(14, 26, 43, 0.05), 0 10px 30px rgba(14, 26, 43, 0.07);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #090f19;
    --surface: #101926;
    --surface-2: #152131;
    --ink: #e8edf4;
    --ink-2: #9aa8bb;
    --ink-3: #7b8a9f;
    --line: #243247;
    --line-2: #1b283a;
    --accent: #4fd1b2;
    --accent-strong: #7be2c9;
    --on-accent: #04211b;
    --accent-soft: #11382f;
    --watch: #e3b04b;
    --watch-soft: #3a2f13;
    --risk: #f2857b;
    --risk-soft: #3d1e1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --bg: #090f19;
  --surface: #101926;
  --surface-2: #152131;
  --ink: #e8edf4;
  --ink-2: #9aa8bb;
  --ink-3: #7b8a9f;
  --line: #243247;
  --line-2: #1b283a;
  --accent: #4fd1b2;
  --accent-strong: #7be2c9;
  --on-accent: #04211b;
  --accent-soft: #11382f;
  --watch: #e3b04b;
  --watch-soft: #3a2f13;
  --risk: #f2857b;
  --risk-soft: #3d1e1c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p,
ul,
dl,
dd,
fieldset {
  margin: 0;
  padding: 0;
}

/* Single-column grids must be allowed to shrink below their content, or wide children push the page sideways. */
.brief,
.sheet,
.breakeven,
.roadmap,
.field,
fieldset,
.signals,
.phase,
.formula,
.explorer,
.fallback {
  grid-template-columns: minmax(0, 1fr);
}

ul {
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 1px 5px;
}

/* ---------- shell ---------- */

.shell {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 650;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.logo-frame {
  fill: var(--surface);
  stroke: var(--ink);
  stroke-width: 1.5;
}
.logo-grid {
  fill: none;
  stroke: var(--ink-3);
  stroke-width: 1.2;
}
.logo-mark {
  fill: var(--accent);
}

.topbar-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.engine {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--surface);
}

.engine-opt {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 550;
  color: var(--ink-2);
  cursor: default;
}
.engine-opt[aria-pressed='true'] {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.engine-opt:disabled {
  opacity: 0.85;
}
.engine-soon {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--ink-3);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-3);
}
.dot-on {
  background: var(--accent);
  border-color: var(--accent);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  cursor: pointer;
}
.icon-btn:hover {
  border-color: var(--ink-3);
}
.theme-ring {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
}
.theme-half {
  fill: var(--ink);
}

.intro {
  padding-block: 28px 22px;
  max-width: 760px;
}
.intro h1 {
  font-family: var(--font-display);
  font-weight: 650;
  font-size: clamp(28px, 4.4vw, 42px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.intro p {
  margin-top: 10px;
  color: var(--ink-2);
  max-width: 62ch;
  font-size: 16px;
}

/* ---------- workspace ---------- */

.workspace {
  display: grid;
  grid-template-columns: minmax(300px, 372px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

.brief-panel {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

@media (min-width: 981px) {
  .brief-panel {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
}

@media (max-width: 980px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- brief ---------- */

.brief {
  padding: 20px;
  display: grid;
  gap: 18px;
}

.brief-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.brief-head h2 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.link-btn {
  border: 0;
  background: none;
  padding: 2px 0;
  color: var(--accent-strong);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.presets {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.presets-label {
  width: 100%;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-weight: 600;
}
.chip-btn {
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
}
.chip-btn:hover {
  border-color: var(--ink-3);
}
.chip-btn[aria-pressed='true'] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--ink);
  font-weight: 600;
}

fieldset {
  border: 0;
  border-top: 1px solid var(--line-2);
  padding-top: 14px;
  min-width: 0;
  display: grid;
  gap: 12px;
}
legend {
  padding: 0 8px 0 0;
  margin-left: 0;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  float: left;
  width: 100%;
  margin-bottom: 12px;
}
legend + * {
  clear: both;
}

.field {
  display: grid;
  gap: 5px;
  min-width: 0;
}
.field label,
.field .label {
  font-size: 13px;
  font-weight: 600;
}
.field input[type='text'],
.field input[type='number'],
.field select,
.field textarea {
  width: 100%;
  min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  line-height: 1.35;
}
.field textarea {
  resize: vertical;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--accent);
  outline: 2px solid var(--accent);
  outline-offset: 0;
}
.field input::placeholder,
.field textarea::placeholder {
  color: var(--ink-3);
}
.field input[aria-invalid='true'] {
  border-color: var(--risk);
}
.field-note {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.4;
}
.field-note.error {
  color: var(--risk);
}
.field-note.hint {
  color: var(--watch);
}

.money {
  position: relative;
}
.money-sym {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-3);
  pointer-events: none;
  min-width: 14px;
}
.money input {
  padding-left: 40px !important;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
input[type='number'] {
  font-variant-numeric: tabular-nums;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.segmented button {
  border: 0;
  background: transparent;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13.5px;
  font-weight: 550;
  color: var(--ink-2);
  cursor: pointer;
}
.segmented button[aria-checked='true'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(14, 26, 43, 0.08);
}

.privacy,
.example-note {
  font-size: 12.5px;
  color: var(--ink-3);
}
.example-note {
  color: var(--accent-strong);
}

/* ---------- sheet ---------- */

.sheet {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  display: grid;
  gap: 22px;
}

.plan-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px 32px;
  flex-wrap: wrap;
}
.plan-title {
  flex: 1 1 320px;
  min-width: 0;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.chip {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
}
.plan-title h2 {
  font-family: var(--font-display);
  font-weight: 650;
  font-size: clamp(26px, 3.4vw, 34px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.headline {
  margin-top: 10px;
  color: var(--ink-2);
  max-width: 60ch;
  font-size: 15.5px;
  text-wrap: pretty;
}

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.be-figure {
  display: grid;
  justify-items: end;
  text-align: right;
  gap: 0;
  padding-left: 28px;
  border-left: 1px solid var(--line);
  min-width: 150px;
}
.be-number {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(56px, 8vw, 84px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.be-undefined .be-number {
  color: var(--risk);
}
.be-unit {
  font-size: 14px;
  color: var(--ink-2);
  margin-top: 4px;
}

@media (max-width: 640px) {
  .be-figure {
    border-left: 0;
    padding-left: 0;
    justify-items: start;
    text-align: left;
  }
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  border-block: 1px solid var(--line);
}
.stats > div {
  padding: 14px 18px 14px 0;
  min-width: 0;
}
.stats > div + div {
  padding-left: 18px;
  border-left: 1px solid var(--line-2);
}
.stats dt {
  font-size: 12.5px;
  color: var(--ink-3);
}
.stats dd {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.stat-sub {
  font-size: 12.5px;
  color: var(--ink-3);
  font-weight: 400;
}
.pos {
  color: var(--accent);
}
.neg {
  color: var(--risk);
}

@media (max-width: 560px) {
  .stats > div + div {
    padding-left: 0;
    border-left: 0;
    border-top: 1px solid var(--line-2);
  }
}

/* ---------- tabs ---------- */

.tabbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px 16px;
  flex-wrap: wrap;
}
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  max-width: 100%;
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.tabs button {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 14px;
  font-weight: 550;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.tabs button:hover {
  color: var(--ink);
}
.tabs button[aria-selected='true'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(14, 26, 43, 0.08);
}

.export {
  display: flex;
  gap: 8px;
}
.btn {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn.ghost:hover {
  border-color: var(--ink-3);
  background: var(--surface-2);
}

.fallback {
  display: grid;
  gap: 8px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 13.5px;
}
.fallback textarea {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}
.fallback .link-btn {
  justify-self: start;
}

.panel {
  min-width: 0;
}
.panel:focus-visible {
  outline-offset: 6px;
  border-radius: 8px;
}

h3 {
  font-family: var(--font-display);
  font-weight: 650;
  font-size: 17px;
  letter-spacing: -0.01em;
}

/* ---------- lean canvas ---------- */

.canvas {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.block {
  background: var(--surface);
  padding: 16px 16px 18px;
  min-width: 0;
}
.block h3 {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 10px;
}
.block-order {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0;
}
.block ul {
  display: grid;
  gap: 8px;
}
.block li {
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  text-wrap: pretty;
}
.block li:first-child {
  font-weight: 550;
}
.block li:not(:first-child) {
  color: var(--ink-2);
}
.block-uvp li:first-child {
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

@media (max-width: 860px) {
  .canvas {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .block-advantage {
    grid-column: 1 / -1;
  }
}
@media (max-width: 520px) {
  .canvas {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- SWOT ---------- */

.swot {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.quad {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  min-width: 0;
}
.quad header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-2);
}
.quad h3 {
  display: flex;
  align-items: center;
  gap: 9px;
}
.quad h3::before {
  content: '';
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--accent);
}
.quad-weaknesses h3::before,
.quad-threats h3::before {
  background: var(--watch);
}
.quad-sub {
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.quad ul {
  display: grid;
  gap: 10px;
}
.quad li {
  font-size: 14px;
  color: var(--ink);
  padding-left: 14px;
  position: relative;
  text-wrap: pretty;
}
.quad li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 5px;
  height: 1.5px;
  background: var(--ink-3);
}

@media (max-width: 700px) {
  .swot {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- break-even ---------- */

.breakeven {
  display: grid;
  gap: 28px;
}

.formula {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: grid;
  gap: 4px;
  overflow-x: auto;
}
.formula-line {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--ink-2);
  white-space: nowrap;
}
.formula-line.working {
  color: var(--ink);
}
.formula-result {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 500;
  color: var(--accent);
  margin-top: 4px;
}
.formula-result.undefined {
  color: var(--risk);
  font-size: 14.5px;
  white-space: normal;
  font-family: var(--font-body);
  font-weight: 600;
}
.formula .eyebrow {
  margin-bottom: 4px;
}

.chart-head {
  margin-bottom: 8px;
}
.chart-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 2px;
}
.chart {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart .grid {
  stroke: var(--line-2);
  stroke-width: 1;
}
.chart .tick {
  fill: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 11px;
}
.chart .axis-title {
  fill: var(--ink-2);
  font-size: 12px;
  font-family: var(--font-body);
}
.chart .rev-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.75;
  stroke-linecap: round;
}
.chart .cost-line {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2.25;
  stroke-linecap: round;
}
.chart .fixed-line {
  stroke: var(--ink-3);
  stroke-width: 1.25;
  stroke-dasharray: 4 5;
}
.chart .profit {
  fill: var(--accent);
  fill-opacity: 0.14;
}
.chart .loss {
  fill: var(--risk);
  fill-opacity: 0.11;
}
.chart .line-label,
.chart .be-label {
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.chart .line-label {
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-body);
}
.chart .rev-label {
  fill: var(--accent);
}
.chart .cost-label {
  fill: var(--ink);
}
.chart .fixed-label {
  fill: var(--ink-3);
  font-weight: 500;
}
.chart .target-line {
  stroke: var(--watch);
  stroke-width: 1.25;
  stroke-dasharray: 2 4;
}
.chart .target-label {
  fill: var(--watch);
}
.chart .be-dot {
  fill: var(--surface);
  stroke: var(--accent);
  stroke-width: 3;
}
.chart .be-label {
  fill: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  font-family: var(--font-body);
}
.chart .explore-line {
  stroke: var(--ink-3);
  stroke-width: 1;
}
.chart .explore-dot {
  stroke: var(--surface);
  stroke-width: 1.5;
}
.chart .explore-dot.rev {
  fill: var(--accent);
}
.chart .explore-dot.cost {
  fill: var(--ink);
}

.explorer {
  display: grid;
  gap: 10px;
  margin-top: 8px;
}
.explorer label {
  font-size: 14px;
  color: var(--ink-2);
}
.explorer strong {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 500;
}
.explorer input[type='range'] {
  width: 100%;
  accent-color: var(--accent);
}

.readout {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.readout.wide {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  margin-top: 10px;
}
.readout > div {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  min-width: 0;
}
.readout dt {
  font-size: 12px;
  color: var(--ink-3);
}
.readout dd {
  font-family: var(--font-mono);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  .readout:not(.wide) {
    grid-template-columns: minmax(0, 1fr);
  }
}

.scenarios h3,
.signals-wrap h3,
.target-summary h3 {
  margin-bottom: 10px;
}
.table-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th,
td {
  padding: 10px 14px;
  text-align: left;
  white-space: nowrap;
}
thead th {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
tbody th {
  font-weight: 550;
}
tbody tr + tr > * {
  border-top: 1px solid var(--line-2);
}
tbody tr.current > * {
  background: var(--accent-soft);
  font-weight: 650;
}
.num {
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
thead .num {
  font-family: var(--font-body);
}

.signals {
  display: grid;
  gap: 8px;
}
.signal {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.signal-tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-align: center;
  border-radius: 999px;
  padding: 3px 0;
  margin-top: 1px;
}
.signal-good .signal-tag {
  background: var(--accent-soft);
  color: var(--accent-strong);
}
.signal-watch .signal-tag {
  background: var(--watch-soft);
  color: var(--watch);
}
.signal-risk .signal-tag {
  background: var(--risk-soft);
  color: var(--risk);
}
.signal-title {
  font-weight: 600;
  font-size: 14.5px;
}
.signal-detail {
  color: var(--ink-2);
  font-size: 13.5px;
  margin-top: 2px;
}

@media (max-width: 480px) {
  .signal {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .signal-tag {
    justify-self: start;
    padding-inline: 12px;
  }
}

/* ---------- roadmap ---------- */

.roadmap {
  display: grid;
  gap: 22px;
}
.ramp-track {
  display: grid;
  gap: 6px;
}
.ramp-step {
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--accent-soft);
  min-width: min(100%, 130px);
}
.ramp-num {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.ramp-day {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.ramp-note {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 8px;
}

.phases {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.phase {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  display: grid;
  gap: 10px;
  align-content: start;
  min-width: 0;
}
.phase-range {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.phase-objective {
  font-size: 14px;
  color: var(--ink-2);
  text-wrap: pretty;
}
.phase-metric {
  display: grid;
  padding-block: 10px;
  border-block: 1px solid var(--line-2);
}
.phase-metric-value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.phase-metric-label {
  font-size: 12.5px;
  color: var(--ink-3);
}
.checklist {
  display: grid;
  gap: 10px;
}
.checklist li {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.checklist input {
  margin: 3px 0 0;
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}
.checklist label {
  font-size: 14px;
  line-height: 1.45;
  cursor: pointer;
  text-wrap: pretty;
}
.checklist input:checked + label {
  color: var(--ink-3);
  text-decoration: line-through;
  text-decoration-color: var(--line);
}
.progress-note {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink-3);
}

@media (max-width: 1180px) {
  .phases {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- footer, toast ---------- */

.foot {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--ink-3);
  font-size: 13px;
  max-width: 78ch;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 550;
  box-shadow: var(--shadow);
  z-index: 20;
}

@media (max-width: 560px) {
  .sheet {
    padding: 16px;
  }
  .brief {
    padding: 16px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .tabs button,
  .segmented button,
  .chip-btn,
  .btn {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
}

/* Break-even tab before a price exists */
.chart-empty {
  display: grid;
  gap: 6px;
  padding: 20px 22px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.chart-empty h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--ink);
}
.chart-empty p {
  margin: 0;
  max-width: 60ch;
  color: var(--ink-2);
  line-height: 1.5;
}
