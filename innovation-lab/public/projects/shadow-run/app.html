<style>
/* SHADOW RUN — dark, moonlit, glowing-blue UI. Landscape-first, scales from small phones to tablets and desktops. */
:root {
  --bg: #04060b; --ink: #e8f1ff; --dim: #8fa3bf; --blue: #35b6ff; --blue2: #7fe0ff; --gold: #ffd36b; --red: #ff4d63; --green: #46e6a0;
  --glass: rgba(9, 14, 26, 0.68); --glass2: rgba(16, 26, 46, 0.78); --line: rgba(120, 190, 255, 0.2);
  --glow: 0 0 1.2rem rgba(53, 182, 255, 0.35);
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  font-size: clamp(11px, min(2.5vh, 1.55vw), 19px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", Roboto, system-ui, sans-serif; overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #04060b; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button, #ui input, #ui select, #ui a, #ui .scroll, #ui .backdrop, #ui .panel, #ui .preview-drag { pointer-events: auto; }
h2, h3, h4, p { margin: 0; }
b { font-weight: 700; }
small { font-size: 0.72rem; }
.dim { color: var(--dim); } .small { font-size: 0.8rem; } .center { text-align: center; } .ok { color: var(--green); } .no { color: var(--dim); }
.spacer { flex: 1; }
:focus-visible { outline: 2px solid var(--blue2); outline-offset: 2px; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }

/* ---------- logo ---------- */
.logo { font-weight: 900; letter-spacing: 0.32em; line-height: 0.95; text-transform: uppercase; display: flex; flex-direction: column; text-shadow: 0 0 1.4rem rgba(53, 182, 255, 0.5); }
.logo span { font-size: 2.6rem; }
.logo .run { color: var(--blue); font-size: 3.7rem; letter-spacing: 0.5em; text-shadow: 0 0 1rem rgba(53, 182, 255, 0.9), 0 0 3rem rgba(53, 182, 255, 0.5); }
.tag { color: var(--dim); letter-spacing: 0.12em; font-size: 0.85rem; margin-top: 0.6rem; }

/* ---------- loading ---------- */
#loading { position: fixed; inset: 0; z-index: 50; background: radial-gradient(ellipse at 50% 40%, #0b1a2c 0%, #04060b 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; transition: opacity 0.5s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading-bar { width: min(22rem, 60vw); height: 0.35rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
#loading-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1b7fd0, var(--blue2)); box-shadow: var(--glow); transition: width 0.25s; }
#loading-msg { color: var(--dim); font-size: 0.85rem; letter-spacing: 0.1em; }
#loading.failed #loading-bar, #loading.failed #loading-msg { display: none; }
#fatal { text-align: center; max-width: 30rem; padding: 0 1rem; display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
#fatal[hidden] { display: none; }
.err { color: var(--red); font-size: 0.85rem; min-height: 1.1em; }

/* ---------- buttons / chips ---------- */
.btn { font: inherit; font-weight: 700; letter-spacing: 0.04em; color: var(--ink); min-height: max(44px, 2.8rem); padding: 0.55rem 1.2rem; border-radius: 0.8rem; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(40, 62, 98, 0.72), rgba(16, 26, 46, 0.82)); cursor: pointer; transition: transform 0.08s, box-shadow 0.15s, border-color 0.15s; text-align: center; position: relative; backdrop-filter: blur(6px); display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
.btn:hover { border-color: var(--blue2); box-shadow: var(--glow); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: linear-gradient(180deg, #2d9be6, #1566b0); border-color: #7fd0ff; box-shadow: 0 0 1.4rem rgba(53, 182, 255, 0.45); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.btn.big { min-height: max(52px, 3.4rem); font-size: 1.15rem; padding: 0.6rem 1.8rem; }
.btn.small { min-height: max(40px, 2.4rem); padding: 0.35rem 0.9rem; font-size: 0.85rem; }
.btn.ghost { background: rgba(10, 16, 28, 0.45); }
.btn.danger { background: linear-gradient(180deg, #a0283a, #6d1626); border-color: #ff8090; }
.btn.disabled-look { opacity: 0.6; }
.btn small { display: block; font-weight: 500; opacity: 0.8; letter-spacing: 0.02em; }
.btn .dot, .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0.6rem var(--gold); margin-left: 0.5rem; vertical-align: middle; animation: pulse 1.4s infinite; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 2rem; background: var(--glass); border: 1px solid var(--line); font-size: 0.95rem; backdrop-filter: blur(6px); white-space: nowrap; }
.chip small { opacity: 0.7; }
.chip.lvl { position: relative; overflow: hidden; } .chip.lvl span { color: var(--dim); font-size: 0.7rem; }
.xpbar { width: 3rem; height: 0.28rem; background: rgba(255, 255, 255, 0.12); border-radius: 1rem; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--blue2); }
.gem { display: inline-block; width: 0.8em; height: 0.8em; background: linear-gradient(135deg, #b8f3ff, #35b6ff 55%, #1a6fd0); transform: rotate(45deg) scale(0.85); border-radius: 0.14em; box-shadow: 0 0 0.6em rgba(53, 182, 255, 0.9); flex: none; }
.big-gem { width: 3.4rem; height: 3.4rem; margin: 0.6rem auto 1.2rem; background: linear-gradient(135deg, #b8f3ff, #35b6ff 55%, #1a6fd0); transform: rotate(45deg); border-radius: 0.5rem; box-shadow: 0 0 2.5rem rgba(53, 182, 255, 0.8); animation: float 2s ease-in-out infinite; }
.big { font-size: 1.6rem; font-weight: 800; }
@keyframes pulse { 50% { opacity: 0.4; transform: scale(0.8); } }
@keyframes float { 50% { transform: rotate(45deg) translate(-4px, 4px); } }

/* ---------- screens ---------- */
#screens { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(0.8rem + var(--safe-t)) calc(1rem + var(--safe-r)) calc(0.8rem + var(--safe-b)) calc(1rem + var(--safe-l)); pointer-events: none; background: linear-gradient(90deg, rgba(3, 5, 10, 0.78), rgba(3, 5, 10, 0.2) 70%); animation: fadein 0.25s; }
#screens[hidden] { display: none; }
#screens > * { pointer-events: none; } #screens > .topbar, #screens > .scroll, #screens .menu-btns, #screens .player-card { pointer-events: auto; }
@keyframes fadein { from { opacity: 0; } }
.topbar { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.7rem; flex: none; }
.topbar h2 { font-size: 1.4rem; letter-spacing: 0.1em; text-transform: uppercase; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; padding-bottom: 1rem; scrollbar-width: thin; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.2rem; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 0.7rem; }
.panel h3 { font-size: 1.05rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue2); }
.panel h4 { font-size: 0.9rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.stack { display: flex; flex-direction: column; gap: 0.8rem; }
.two-col { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; overflow-y: auto; touch-action: pan-y; align-content: start; pointer-events: auto; }
.two-col.wide-left { grid-template-columns: 1.4fr 1fr; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.3rem; } .actions.center { justify-content: center; }
.row { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 0.35rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); } .row span { color: var(--dim); }
.stat { display: flex; flex-direction: column; gap: 0.1rem; padding: 0.5rem 0.8rem; background: rgba(255, 255, 255, 0.04); border-radius: 0.7rem; } .stat small { color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; } .stat b { font-size: 1.15rem; }
.records, .res-grid, .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
.stats-grid { grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); padding: 0.2rem; }
.hist { margin: 0; padding: 0; list-style: none; max-height: 8rem; overflow: auto; display: flex; flex-direction: column; gap: 0.2rem; } .hist li { display: flex; justify-content: space-between; padding: 0.2rem 0.5rem; background: rgba(255, 255, 255, 0.04); border-radius: 0.4rem; }
.bar { height: 0.45rem; background: rgba(255, 255, 255, 0.1); border-radius: 1rem; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #1b7fd0, var(--blue2)); border-radius: 1rem; transition: width 0.3s; }
.stars { display: inline-flex; gap: 0.1rem; font-size: 1.2rem; color: rgba(255, 255, 255, 0.2); } .stars i { font-style: normal; } .stars i.on { color: var(--gold); text-shadow: 0 0 0.6rem rgba(255, 211, 107, 0.7); }
.tabs { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; } .tab { font: inherit; font-weight: 700; color: var(--dim); background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; min-height: 40px; } .tab.on { color: var(--ink); background: rgba(53, 182, 255, 0.2); border-color: var(--blue); }
.link { color: var(--blue2); } .eyebrow { color: var(--dim); letter-spacing: 0.2em; }
.ch-title { font-size: 1.6rem; } .ch-text { font-size: 1.15rem; color: var(--blue2); }
.timer { font-variant-numeric: tabular-nums; }

/* ---------- main menu ---------- */
.menu { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.menu-top { display: flex; align-items: center; gap: 0.6rem; pointer-events: auto; }
.player-card { display: flex; gap: 0.6rem; align-items: center; } .player-card small { display: block; color: var(--dim); }
.avatar { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #1e2638, #080b12); border: 2px solid var(--c, var(--blue)); box-shadow: 0 0 0.8rem var(--c, var(--blue)); }
.acct-dot::before { content: ''; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #566; margin-right: 0.4rem; } .acct-dot.on::before { background: var(--green); box-shadow: 0 0 0.5rem var(--green); }
.menu-main { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 0; }
.title-block { flex: 1; } .menu-btns { width: min(24rem, 46vw); display: flex; flex-direction: column; gap: 0.6rem; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; } .menu-grid .wide { grid-column: span 2; } .menu-grid .btn { min-height: max(42px, 2.6rem); font-size: 0.9rem; padding: 0.4rem 0.6rem; }

/* ---------- story ---------- */
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.7rem; padding: 0.3rem; }
.card { font: inherit; color: var(--ink); text-align: left; border: 1px solid var(--line); border-radius: 0.9rem; padding: 0.7rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.3rem; position: relative; transition: transform 0.12s, box-shadow 0.15s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--glow); border-color: var(--blue2); }
.card.level { min-height: 6.6rem; justify-content: space-between; overflow: hidden; }
.card.level .num { font-size: 2.2rem; font-weight: 900; opacity: 0.85; line-height: 1; text-shadow: 0 0 1rem rgba(0, 0, 0, 0.6); } .card.level .lname { font-weight: 700; text-shadow: 0 1px 3px #000; }
.card.locked { filter: grayscale(1) brightness(0.45); cursor: default; } .card.locked:hover { transform: none; box-shadow: none; }
.card .lock { font-size: 1.2rem; }
.brief .goals, .goals { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.35rem; } .goals b { color: var(--gold); }
.ticks .ok { color: var(--green); }

/* ---------- characters ---------- */
.chars { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(15rem, 1.1fr) 1fr minmax(13rem, 0.9fr); gap: 1rem; pointer-events: none; }
.char-left { display: flex; flex-direction: column; min-height: 0; pointer-events: auto; } .skin-list { overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; touch-action: pan-y; padding: 0.2rem; align-content: start; }
.card.skin { min-height: 4.6rem; padding: 0.5rem; background: var(--glass); } .card.skin.sel { border-color: var(--blue2); box-shadow: var(--glow); } .card.skin.unowned .swatch { filter: saturate(0.5) brightness(0.7); }
.swatch { height: 1.4rem; border-radius: 0.4rem; } .sname { font-weight: 700; font-size: 0.85rem; }
.tag { font-size: 0.68rem; letter-spacing: 0.08em; color: var(--dim); } .tag.eq { color: var(--green); } .tag.price { color: var(--gold); }
.preview-drag { cursor: grab; touch-action: none; min-height: 8rem; } .detail { align-self: end; background: var(--glass); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: auto; backdrop-filter: blur(10px); }
.ok-pill { color: var(--green); font-weight: 700; padding: 0.4rem 0.8rem; border: 1px solid var(--green); border-radius: 2rem; } .lock-note { color: var(--gold); font-weight: 600; }

/* ---------- missions / achievements ---------- */
.mission-list { display: flex; flex-direction: column; gap: 0.6rem; } .mission { display: grid; grid-template-columns: 1fr auto auto; gap: 0.8rem; align-items: center; padding: 0.6rem 0.8rem; background: rgba(255, 255, 255, 0.04); border-radius: 0.8rem; } .mission.claimed { opacity: 0.55; } .m-text { display: flex; flex-direction: column; gap: 0.25rem; } .m-reward { display: flex; flex-direction: column; align-items: flex-end; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: 0.6rem; padding: 0.2rem; } .badge { background: var(--glass); border: 1px solid var(--line); border-radius: 0.9rem; padding: 0.7rem; display: flex; flex-direction: column; gap: 0.2rem; opacity: 0.55; filter: grayscale(0.8); } .badge.on { opacity: 1; filter: none; border-color: rgba(255, 211, 107, 0.5); box-shadow: 0 0 1rem rgba(255, 211, 107, 0.15); } .badge .ico { font-size: 1.8rem; } .badge .rw { color: var(--gold); font-size: 0.8rem; display: flex; gap: 0.3rem; align-items: center; }

        sb.push(c.x + s.x * 300, c.y + s.y * 300, c.z + s.z * 300 - 150, 0.75, 0.85, 1, s.b * tw * 0.9, s.s * this.pixelScale);
      }
      sb.draw(r, 2, 0, 5000);
    }
    if (th.moon) {
      const md = this.env.moonDir;
      const dx = md[0] * 0.8, dy = th.moon.h * 0.36, dz = -0.85;
      const l = Math.hypot(dx, dy, dz), D = 360;
      const mx = c.x + (dx / l) * D, my = c.y + (dy / l) * D, mz = c.z + (dz / l) * D;
      const rad = th.moon.size * 0.8;
      const col = th.moon.col;
      this.halos.clear();
      this.halos.push(mx, my, mz, col[0] * 0.5, col[1] * 0.55, col[2] * 0.7, 0.35, 360 * this.pixelScale);
      this.halos.push(mx, my, mz, col[0] * 0.6, col[1] * 0.65, col[2] * 0.8, 0.45, 190 * this.pixelScale);
      this.halos.draw(r, 2, 0, 5000);
      r.useMain();
      const x = this.xf.reset().translate(mx, my, mz).scale(rad, rad, rad);
      tintA[0] = col[0]; tintA[1] = col[1]; tintA[2] = col[2]; tintA[3] = 1;
      r.draw(this.m.moon, x.m, tintA, 1, 0, 1, 0);
      // dim craters / cloud wisps
      this.xf.reset().translate(mx - rad * 0.28, my + rad * 0.2, mz + rad * 0.8).scale(rad * 0.3, rad * 0.26, rad * 0.1);
      tintA[0] = col[0] * 0.78; tintA[1] = col[1] * 0.8; tintA[2] = col[2] * 0.86;
      r.draw(this.m.moon, this.xf.m, tintA, 1, 0, 1, 0);
    }
    gl.clear(gl.DEPTH_BUFFER_BIT); // sky bodies never occlude the world
  }

  // ------------------------------------------------------------------ lights
  _collectLights(ps, px, py, mode) {
    const r = this.r, th = this.theme;
    const acc = this.skin ? hex(this.skin.accent) : th.ground.edge;
    r.lightN = 0;
    if (mode !== 'preview') r.addLight(px, 2.0 + py, 1.2, acc[0] * 0.9, acc[1] * 0.9, acc[2] * 0.9, 9);
    else r.addLight(1.5, 2.2, 2.4, acc[0], acc[1], acc[2], 8);
    const found = [];
    if (mode !== 'preview') {
      const k0 = Math.floor((ps - 6) / CHUNK), k1 = Math.floor((ps + 60) / CHUNK);
      for (let k = k0; k <= k1; k++) {
        for (const it of this._chunk(k)) {
          if (!it.d.glow) continue;
          const z = -(it.s - ps);
          if (z > 4 || z < -55) continue;
          found.push(it);
        }
      }
      found.sort((a, b) => a.s - b.s);
      for (let i = 0; i < found.length && r.lightN < r.maxLights; i++) {
        const it = found[i], g = it.d.glow, z = -(it.s - ps);
        const fl = it.d.flicker ? 0.8 + 0.2 * Math.sin(this.time * 17 + it.ph) * Math.sin(this.time * 5 + it.ph) : 1;
        r.addLight(it.x, it.d.glowY + it.y, z, g[0] * 1.3 * fl, g[1] * 1.3 * fl, g[2] * 1.3 * fl, g[3] * 1.5 + 4);
      }
    } else {
      r.addLight(-2, 2.5, 1, 0.3, 0.45, 0.8, 9);
    }
    return found;
  }

  // ------------------------------------------------------------------ world
  _drawWorld(sim, ps, th, mode) {
    const r = this.r, xf = this.xf, q = this.q;
    const VD = q.view;
    const rows = sim.track.rows;
    // visible rows range
    let r0 = 0;
    while (r0 < rows.length && rows[r0].s + 6 < ps - 8) r0++;
    this._rows0 = r0;

    // ---- road with pits
    const ground = th.ground;
    const pitsByLane = [[], [], []];
    const pitsAll = [];
    for (let i = r0; i < rows.length; i++) {
      const row = rows[i];
      if (row.s > ps + VD + 12) break;
      for (let l = 0; l < 3; l++) if (row.cells[l] === CELL.PIT) { pitsByLane[l].push(row); }
      if (row.cells[0] === CELL.PIT || row.cells[1] === CELL.PIT || row.cells[2] === CELL.PIT) pitsAll.push(row);
    }
    const sA = ps - 12, sB = ps + VD + 14;
    const roadTint = [ground.road[0], ground.road[1], ground.road[2], 1];
    const edgeC = ground.edge;
    const spec = 0.08 + th.wet * 0.4;
    const lane0 = th.chasm ? 1 : 0;
    void lane0;
    for (let l = 0; l < 3; l++) {
      let cursor = sA;
      const list = pitsByLane[l];
      const seg = (a, b) => {
        if (b - a < 0.05) return;
        const zc = -((a + b) / 2 - ps);
        xf.reset().translate(laneX(l), -1.5, zc).scale(LANE_W - 0.01, 3, b - a);
        r.draw(this.m.box, xf.m, roadTint, 0, spec, 0, 1, 0.25);
        // outer edge glow strips + pit rim lines
        if (l === 0 || l === 2) {
          const ex = laneX(l) + (l === 0 ? -1 : 1) * (LANE_W / 2 - 0.05);
          xf.reset().translate(ex, 0.012, zc).scale(0.1, 0.03, b - a);
          tintA[0] = edgeC[0]; tintA[1] = edgeC[1]; tintA[2] = edgeC[2]; tintA[3] = 1;
          r.draw(this.m.box, xf.m, tintA, 1, 0, 1, 0.5);
        }
      };
      for (const p of list) {
        seg(cursor, Math.max(cursor, p.s));
        cursor = Math.max(cursor, p.s + DEPTH[CELL.PIT]);
        // pit abyss + rim lines
        const zc = -(p.s + DEPTH[CELL.PIT] / 2 - ps);
        xf.reset().translate(laneX(l), -3.05, zc).scale(LANE_W - 0.01, 0.1, DEPTH[CELL.PIT]);
        const pt = OB.pit; const pc = hex(pt);
        tintA[0] = pc[0] * 0.25; tintA[1] = pc[1] * 0.25; tintA[2] = pc[2] * 0.3; tintA[3] = 1;
        r.draw(this.m.box, xf.m, tintA, 0.4, 0, 1, 0.8);
        for (const zz of [p.s, p.s + DEPTH[CELL.PIT]]) {
          xf.reset().translate(laneX(l), 0.02, -(zz - ps)).scale(LANE_W - 0.04, 0.05, 0.12);
          tintA[0] = pc[0]; tintA[1] = pc[1]; tintA[2] = pc[2];
          r.draw(this.m.box, xf.m, tintA, 1, 0, 1, 0.4);
        }
      }
      seg(cursor, sB);
    }
    // overlay tiles (lane dashes, wear)
    if (q.overlay) {
      const T = 8;
      const k0 = Math.floor(sA / T), k1 = Math.floor(sB / T);
      for (let k = k0; k <= k1; k++) {
        const a = k * T, b = a + T;
        let blocked = false;
        for (const p of pitsAll) if (p.s < b + 0.1 && p.s + DEPTH[CELL.PIT] > a - 0.1) { blocked = true; break; }
        if (blocked) continue;
        for (let l = 0; l < 3; l++) {
          xf.reset().translate(laneX(l), 0.006, -(a + T / 2 - ps));
          tintA[0] = edgeC[0] * 0.5; tintA[1] = edgeC[1] * 0.5; tintA[2] = edgeC[2] * 0.5;
          if (l === 1) r.draw(this.m.tiles[((k % 3) + 3) % 3], xf.m, tintA, 0.6, 0, 1, 0.6);
          else { // wear marks only (dashes belong to lane 1 tile which spans both dividers)
            xf.reset().translate(laneX(l), 0.006, -(a + T / 2 - ps));
            tintA[0] = ground.road[0] * 2.2; tintA[1] = ground.road[1] * 2.2; tintA[2] = ground.road[2] * 2.2;
            r.draw(this.m.tiles[(((k + l) % 3) + 3) % 3], xf.m, tintA, 0, spec, 0, 1, 0.25);
          }
        }
      }
    }
    // side ground / tunnel / bridge furniture
    if (!th.chasm && !th.tunnel) {
      for (const sd of [-1, 1]) {
        xf.reset().translate(sd * (ROAD_HALF + 40), -1.55, -(VD / 2 - 6)).scale(80, 3, VD + 40);
        tintA[0] = ground.side[0]; tintA[1] = ground.side[1]; tintA[2] = ground.side[2]; tintA[3] = 1;
        r.draw(this.m.box, xf.m, tintA, 0, 0, 0, 1, 0.1);
      }
    }
    if (th.tunnel) {
      const T = 12;
      const k0 = Math.floor((ps - 8) / T), k1 = Math.floor((ps + VD + 10) / T);
      for (let k = k0; k <= k1; k++) {
        xf.reset().translate(0, 0, -(k * T - ps));
        tintA[0] = 1; tintA[1] = 1; tintA[2] = 1;
        r.draw(this.m.rib, xf.m, WHITE, 0, 0.05, 0, 1);
      }
      for (const sd of [-1, 1]) {
        xf.reset().translate(sd * 8.9, 4, -(VD / 2 - 6)).scale(0.8, 12, VD + 40);
        tintA[0] = 0.04; tintA[1] = 0.05; tintA[2] = 0.07;
        r.draw(this.m.box, xf.m, tintA, 0, 0, 0, 1);
        xf.reset().translate(sd * 14, -1.5, -(VD / 2 - 6)).scale(10, 3, VD + 40);
        tintA[0] = ground.side[0]; tintA[1] = ground.side[1]; tintA[2] = ground.side[2];
        r.draw(this.m.box, xf.m, tintA, 0, 0, 0, 1);
      }
      xf.reset().translate(0, 8.9, -(VD / 2 - 6)).scale(19, 0.8, VD + 40);
      tintA[0] = 0.05; tintA[1] = 0.06; tintA[2] = 0.08;
      r.draw(this.m.box, xf.m, tintA, 0, 0, 0, 1);
    }
    if (th.chasm) {
      const T = 6;
      const k0 = Math.floor((ps - 6) / T), k1 = Math.floor((ps + VD) / T);
      for (let k = k0; k <= k1; k++) {
        if (((k * 2654435761) >>> 0) % 7 === 0) continue; // broken railing sections
        xf.reset().translate(0, 0, -(k * T + T / 2 - ps));
        r.draw(this.m.rail, xf.m, WHITE, 0, 0.1, 0, 1);
      }
      // bridge edge beams
      for (const sd of [-1, 1]) {
        xf.reset().translate(sd * (ROAD_HALF + 0.1), -0.1, -(VD / 2 - 6)).scale(0.3, 0.5, VD + 40);
        tintA[0] = 0.08; tintA[1] = 0.09; tintA[2] = 0.12;
        r.draw(this.m.box, xf.m, tintA, 0, 0, 0, 1);
      }
    }

    // ---- scenery props
    const k0 = Math.floor((ps - 14) / CHUNK), k1 = Math.floor((ps + VD) / CHUNK);
    const t = this.time;
    for (let k = k0; k <= k1; k++) {
      for (const it of this._chunk(k)) {
        const z = -(it.s - ps);
        if (z > 10 || z < -VD) continue;
        xf.reset().translate(it.x, it.y + (it.d.floaty ? Math.sin(t * 0.7 + it.ph) * 0.6 : 0), z);
        if (it.yaw) xf.rotY(it.yaw);
        if (it.d.sway) xf.rotZ(Math.sin(t * 0.8 + it.ph) * it.d.sway * 3);
        if (it.d.floaty) xf.rotY(t * 0.2 + it.ph);
        if (it.sc !== 1) xf.scale(it.sc, it.sc, it.sc);
        r.draw(it.mesh, xf.m, WHITE, 0, 0, 0, 1);
      }
    }

    // ---- obstacles
    const A = this.assets;
    this.halos.clear();
    for (let i = r0; i < rows.length; i++) {
      const row = rows[i];
      if (row.s > ps + VD) break;
      if (row.cleared) continue;
      for (let l = 0; l < 3; l++) {
        const cell = row.cells[l];
        if (cell === CELL.FREE || cell === CELL.PIT) continue;
        const zc = -(row.s + DEPTH[cell] / 2 - ps);
        xf.reset().translate(laneX(l), 0, zc);
        const v = (row.id + l) & 1;
        if (cell === CELL.LOW) r.draw(A.low[v], xf.m, WHITE, 0.05, 0.1, 0, 0.45);
        else if (cell === CELL.HIGH) r.draw(A.high[v], xf.m, WHITE, 0.05, 0.1, 0, 0.45);
        else if (cell === CELL.WALL) r.draw(A.wall[v], xf.m, WHITE, 0.03, 0.1, 0, 0.5);
      }
    }
    // secret (illusory) walls, drawn translucent after opaque geometry
    r.setBlend(1);
    for (let i = r0; i < rows.length; i++) {
      const row = rows[i];
      if (row.s > ps + VD) break;
      for (let l = 0; l < 3; l++) {
        if (row.cells[l] !== CELL.SECRET) continue;
        const zc = -(row.s + DEPTH[CELL.SECRET] / 2 - ps);
        xf.reset().translate(laneX(l), 0, zc);
        const sh = 0.5 + 0.18 * Math.sin(t * 3 + l * 2);
        tintA[0] = 0.55; tintA[1] = 0.4; tintA[2] = 1; tintA[3] = row.secretFound ? 0.12 : sh * 0.75;
        r.draw(A.wall[0], xf.m, tintA, 0.35, 0, 1, 0.5);
      }
    }
    r.setBlend(0);

    // ---- crystals
    const cs = sim.track.crystals;
    const h = this.halos;
    for (let i = sim.crystalIdx; i < cs.length; i++) {
      const c = cs[i];
      if (c.s > ps + VD) break;
      if (c.taken) continue;
      const z = -(c.s - ps);
      if (z > 6) continue;
      const bob = Math.sin(t * 3 + c.id) * 0.07;
      xf.reset().translate(c.x, c.y + bob, z).rotY(t * 2.2 + c.id).rotZ(Math.sin(t * 1.6 + c.id) * 0.12);
      if (c.kind === 1) { r.draw(this.m.gemGold, xf.m, WHITE, 1, 0.6, 1, 0.35); h.push(c.x, c.y + bob, z, 1, 0.75, 0.35, 0.8, 1.5); }
      else { r.draw(this.m.gem, xf.m, WHITE, 1, 0.6, 1, 0.35); h.push(c.x, c.y + bob, z, 0.3, 0.8, 1, 0.65, 0.95); }
    }

    // ---- finish gate
    if (sim.gateS !== null && (sim.objDone || (sim.cfg.objective && sim.cfg.objective.type === 'distance'))) {
      const z = -(sim.gateS - ps);
      if (z > -VD - 20 && z < 8) {
        xf.reset().translate(0, 0, z);
        r.draw(this.m.gate, xf.m, WHITE, 0.7, 0.2, 0, 0.3);
        r.setBlend(2);
        const pulse = 0.5 + 0.2 * Math.sin(t * 2.6);
        xf.reset().translate(0, 0, z - 0.1);
        tintA[0] = 0.18 * pulse; tintA[1] = 0.3 * pulse; tintA[2] = 0.5 * pulse; tintA[3] = 1;
        r.draw(this.m.gatePlane, xf.m, tintA, 1, 0, 1, 0.2);
        r.setBlend(0);
        for (let i = 0; i < 10; i++) {
          const a = t * 1.4 + i * 0.63;
          h.push(Math.sin(a) * 2.6, 3.6 + Math.cos(a * 1.3) * 3.1, z - 0.2, 0.5, 0.8, 1, 0.8, 1.0);
        }
        h.push(0, 4, z, 0.4, 0.6, 1, 0.35, 7);
      }
    }
  }

  // ------------------------------------------------------------------ runner / shade
  _drawRunnerState(sim, px, py, dt, mode) {
    const r = this.r, xf = this.xf, fx = this.fx;
    const s = sim;
    let y = py, yaw = 0, roll = 0;
    const vx = s ? s.p.vx : 0;
    yaw = clamp(-vx * 0.03, -0.45, 0.45);
    roll = clamp(-vx * 0.014, -0.2, 0.2);
    const falling = fx.deadKind === 'fell';
    if (falling) y = -fx.dead * fx.dead * 6;
    const blink = s && s.invuln > 0 && fx.dead === 0 && Math.floor(this.time * 18) % 2 === 0;
    const tint = blink ? [1.5, 0.9, 0.9, 1] : WHITE;
    const run = mode === 'menu' ? 1 : (s && s.over && !falling && fx.dead > 0) ? 0 : 1;
    xf.reset();
    drawRunner(r, xf, this.parts, {
      x: px, y, z: 0, yaw, roll, pitch: 0, phase: fx.phase, run: run * (s && s.t < 0.2 ? 0.5 : 1),
      air: fx.air, slide: fx.slide, stumble: fx.stumble, dead: falling ? 0 : fx.dead, t: this.time,
    }, tint);
    // contact shadow
    if (!falling && y < 2) {
      xf.reset().translate(px, 0.02, 0).scale(0.55 - Math.min(0.3, y * 0.08), 1, 0.55 - Math.min(0.3, y * 0.08));
      r.setBlend(1);
      tintA[0] = 0; tintA[1] = 0; tintA[2] = 0; tintA[3] = clamp(0.5 - y * 0.15, 0.1, 0.5);
      r.draw(this.m.disc, xf.m, tintA, 0, 0, 1, 0);
      r.setBlend(0);
    }
    // trail
    if (this.trail && s && !s.over && mode !== 'menu') {
      const tr = this.trail;
      for (let i = 0; i < tr.rate; i++) {
        if (Math.random() < Math.min(1, dt * 60 * 0.5)) this.burst.emit(px + (Math.random() - 0.5) * 0.3, y + 0.15 + Math.random() * 0.9, 0.3, 1, 1.4, tr.life, tr.rgb, tr.size, tr.gravity ?? -1, 0.4);
      }
    }
    // dust at feet while running
    if (s && !s.over && s.p.grounded && Math.random() < dt * 30) this.burst.emit(px, 0.04, 0.15, 1, 1.0, 0.4, mix3(this.theme.ground.edge, [0.5, 0.5, 0.5], 0.5), 3, -1, 0.3);
  }

  _drawShade(sim, px, dt, ps) {
    if (!sim) return;
    const gap = sim.chaser.gap;
    const fx = this.fx;
    const r = this.r, xf = this.xf;
    const near = clamp((CHASER.max - gap) / (CHASER.max - CHASER.catch), 0, 1);
    this.chaserX = damp(this.chaserX ?? px, px, 3, dt || 0.016);
    const z = Math.max(1.2, gap) + (fx.dead > 0 && fx.deadKind === 'caught' ? -fx.dead * 1.4 : 0);
    const bob = Math.sin(this.time * 2.4) * 0.25;
    this.mist.clear();
    if (near > 0.02 || gap < CHASER.max) {
      xf.reset().translate(this.chaserX, 0.1 + bob, z).rotY(Math.sin(this.time * 0.9) * 0.15).scale(1.2, 1.2 + Math.sin(this.time * 3) * 0.04, 1.2);
      r.draw(this.m.shade, xf.m, WHITE, 0.0, 0.3, 0, 0.25);
      for (let i = 0; i < 6; i++) {
        const a = this.time * 0.9 + i * 1.05;
        this.mist.push(this.chaserX + Math.cos(a) * 1.4, 0.6 + (i % 3) * 0.9, z + Math.sin(a) * 0.8, 0.03, 0.02, 0.06, 0.5 + 0.3 * near, 3.2);
      }
    }
  }

  // ------------------------------------------------------------------ preview (character screen)
  _drawPreview(f, th) {
    const r = this.r, xf = this.xf, t = this.time, fx = this.fx;
    const acc = this.skin ? hex(this.skin.accent) : [0.2, 0.7, 1];
    // podium
    xf.reset().translate(0, 0, 0).scale(1.9, 0.14, 1.9);
    tintA[0] = 0.05; tintA[1] = 0.06; tintA[2] = 0.09; tintA[3] = 1;
    r.draw(this.m.box, xf.m, tintA, 0, 0.6, 0, 1);
    xf.reset().translate(0, -0.06, 0).scale(2.3, 0.1, 2.3);
    r.draw(this.m.disc, xf.m, [acc[0] * 0.35, acc[1] * 0.35, acc[2] * 0.35, 1], 1, 0, 1, 0.3);
    xf.reset().translate(0, 0.075, 0).scale(1.75, 1, 1.75);
    r.draw(this.m.disc, xf.m, [acc[0] * 0.8, acc[1] * 0.8, acc[2] * 0.8, 1], 1, 0, 1, 0.3);
    xf.reset().translate(0, 0.08, 0).scale(1.55, 1, 1.55);
    r.draw(this.m.disc, xf.m, [0.03, 0.04, 0.06, 1], 0, 0.5, 0, 1);
    const yaw = f.yaw !== undefined ? f.yaw : t * 0.6;
    xf.reset();
    drawRunner(r, xf, this.parts, { x: 0, y: 0.08, z: 0, yaw, roll: 0, pitch: 0, phase: t * 3, run: 0.0, air: 0, slide: 0, stumble: 0, dead: 0, t }, WHITE);
    this.halos.clear();
    for (let i = 0; i < 18; i++) {
      const a = t * 0.5 + i * 0.35, rr = 1.3 + (i % 4) * 0.25;
      this.halos.push(Math.cos(a) * rr, 0.3 + ((t * 0.4 + i * 0.17) % 2.4), Math.sin(a) * rr, acc[0], acc[1], acc[2], 0.7, 0.18);
    }
  }

  // ------------------------------------------------------------------ particles
  _drawParticles(dt, sim, ps, lights, scroll, th, mode) {
    const r = this.r, c = this.cam;
    const spd = sim ? sim.speed : 8;
    this.burst.update(dt, scroll);
    this.burst.fill();
    this.burst.draw(r);
    if (mode !== 'preview') {
      this.weather.update(dt, this.time, spd);
      this.weather.fill(c.x, th.ambient.color, 0.03);
      this.weather.draw(r);
      if (th.glowFlies) {
        this.flies.update(dt, this.time, spd * 0.5);
        this.flies.fill(c.x, [0.4, 0.95, 1], 0.03);
        this.flies.draw(r);
      }
      // glow halos for lit props (additive), screen-space sized by attenuation
      const h = this.halos;
      for (const it of lights) {
        const g = it.d.glow, z = -(it.s - ps);
        const fl = it.d.flicker ? 0.75 + 0.25 * Math.sin(this.time * 17 + it.ph) : 1;
        h.push(it.x, it.d.glowY + it.y, z, g[0], g[1], g[2], 0.55 * fl, g[3] * 0.45);
      }
      // far glow props (not in the near-light list)
      if (this.q.small) {
        const VD = this.q.view;
        const k0 = Math.floor((ps + 55) / CHUNK), k1 = Math.floor((ps + VD) / CHUNK);
        for (let k = k0; k <= k1; k++) for (const it of this._chunk(k)) {

// Deterministic PRNG utilities. Pure; no browser or Node globals.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

class RNG {
  constructor(seed) {
    this.f = mulberry32(seed);
  }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return a + Math.floor(this.f() * (b - a)); } // [a, b)
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }

  weighted(weights) {
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];

    let r = this.f() * total;
    for (let i = 0; i < weights.length; i++) {

    }
